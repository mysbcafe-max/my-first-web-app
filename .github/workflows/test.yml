name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: シフト生成ロジックのテスト
        run: node --test "shift/test/*.test.js"
      - name: JS の構文チェック
        run: node --check shift/app.js && node --check shift/scheduler.js
